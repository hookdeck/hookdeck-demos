<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vapi agency routing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 24px; background: #f6f7f9; color: #1b1f24; }
  h1 { font-size: 20px; margin: 0 0 4px; } p.sub { margin: 0 0 20px; color: #5b6570; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  .col { background: #fff; border: 1px solid #dde1e6; border-radius: 8px; padding: 16px; }
  .col h2 { font-size: 16px; margin: 0; } .path { color: #5b6570; font-family: ui-monospace, monospace; font-size: 12px; margin-bottom: 12px; }
  .ev { border-top: 1px solid #eef0f2; padding: 8px 0; } .ev b { font-family: ui-monospace, monospace; font-size: 12px; }
  .t { color: #8a949e; font-size: 12px; } .d { word-break: break-word; }
  .live-call-control b { color: #0a7d4f; } .tool-calls b { color: #1d5fd1; } .misrouted b, .lookup-error b { color: #c0392b; }
  .call { background: #f0f4ff; border: 1px solid #d3defa; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
  .call button { font: inherit; font-weight: 600; padding: 6px 14px; border-radius: 6px; border: 1px solid #1d5fd1; background: #1d5fd1; color: #fff; cursor: pointer; }
  .call button.end { background: #c0392b; border-color: #c0392b; } .call button:disabled { opacity: .5; cursor: not-allowed; }
  .call .status { margin-left: 10px; color: #5b6570; } .call .say { margin-top: 8px; } .call .say q { font-weight: 600; }
  .call .err { color: #c0392b; margin-top: 6px; }
  .expect { font-size: 13px; color: #3d4752; margin-bottom: 12px; }
  .empty { color: #8a949e; }
</style>
</head>
<body>
<h1>Vapi agency routing</h1>
<p class="sub">Each column is one client's endpoint. Events arrive through that client's Hookdeck source.</p>
<div class="cols" id="cols"></div>
<div id="cfg-error" class="empty"></div>
<script>
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
async function refresh() {
  const data = await (await fetch('/api/state')).json();
  document.getElementById('cols').innerHTML = data.map((c) => `
    <div class="col"><h2>${esc(c.name)}</h2><div class="path">${esc(c.path)}</div>
    <div class="expect">${esc(c.expect_note)}</div>
    <div class="call" id="call-${esc(c.slug)}"></div>
    ${c.events.length ? c.events.map((e) => `<div class="ev ${esc(e.type)}"><b>${esc(e.type)}</b>
      <span class="t">${new Date(e.at).toLocaleTimeString()}${e.bytes ? ' · ' + (e.bytes / 1024).toFixed(1) + ' KB' : ''}${e.call_id ? ' · ' + esc(e.call_id.slice(0, 8)) : ''}</span>
      <div class="d">${esc(e.detail)}</div></div>`).join('') : '<div class="empty">No events yet.</div>'}
    </div>`).join('');
}

// ---- Start call: Vapi Web SDK, pinned and loaded as an ESM build from esm.sh (no build step in this demo)
let vapi = null, config = null, active = null; // active: slug of the client with a call in progress
const status = {};  // slug -> { text, error }
const setStatus = (slug, text, error) => { status[slug] = { text, error }; renderCalls(); };

function renderCalls() {
  if (!config) return;
  for (const c of config.clients) {
    const el = document.getElementById('call-' + c.slug);
    if (!el) continue;
    const st = status[c.slug] || { text: 'Idle' };
    const in_call = active === c.slug;
    const can_start = !!(config.vapi_public_key && c.assistant_id) && !active;
    el.innerHTML = `<button class="${in_call ? 'end' : ''}" data-slug="${esc(c.slug)}" ${in_call || can_start ? '' : 'disabled'}>${in_call ? 'End call' : 'Start call'}</button>
      <span class="status">${esc(st.text)}</span>
      <div class="say">Say: <q>${esc(c.suggested_line)}</q></div>
      ${!config.vapi_public_key ? '<div class="err">VAPI_PUBLIC_KEY is not set in .env</div>' : !c.assistant_id ? '<div class="err">No assistant ID; run npm run setup</div>' : ''}
      ${st.error ? '<div class="err">' + esc(st.error) + '</div>' : ''}`;
  }
}

async function startCall(slug) {
  const c = config.clients.find((x) => x.slug === slug);
  active = slug; setStatus(slug, 'Connecting...');
  try {
    if (!vapi) {
      const { default: Vapi } = await import('https://esm.sh/@vapi-ai/web@3.0.1');
      vapi = new Vapi(config.vapi_public_key);
      vapi.on('call-start', () => active && setStatus(active, 'In call'));
      vapi.on('call-end', () => { const s = active; active = null; if (s) setStatus(s, 'Call ended'); });
      vapi.on('speech-start', () => active && setStatus(active, 'Assistant speaking'));
      vapi.on('speech-end', () => active && setStatus(active, 'Listening'));
      vapi.on('message', (m) => { if (m.type === 'transcript' && m.transcriptType === 'final' && active) console.log(m.role + ': ' + m.transcript); });
      vapi.on('error', (e) => { const s = active; active = null; if (s) setStatus(s, 'Error', (e && (e.errorMsg || e.error?.message || e.message)) || JSON.stringify(e)); });
    }
    await vapi.start(c.assistant_id);
  } catch (e) { active = null; setStatus(slug, 'Error', e.message || String(e)); }
}

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('.call button'); if (!b || b.disabled) return;
  if (active === b.dataset.slug) { setStatus(active, 'Ending...'); vapi.stop(); } else startCall(b.dataset.slug);
});

(async () => {
  await refresh();
  try { config = await (await fetch('/api/config')).json(); } catch (e) { document.getElementById('cfg-error').textContent = 'Could not load /api/config'; }
  renderCalls();
})();
setInterval(async () => { await refresh(); renderCalls(); }, 1500);
</script>
</body>
</html>
