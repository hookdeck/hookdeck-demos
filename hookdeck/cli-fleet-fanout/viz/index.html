<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fleet fan-out</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0c0e13; color: #e8eaef; }
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body.capture {
        width: 960px;
        height: 520px;
        overflow: hidden;
        background: #12151c;
      }
      body.capture svg { display: block; }
      #app.scripted {
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 24px;
        align-items: center;
      }
      #app.live { max-width: 1240px; margin: 0 auto; padding: 20px 20px 56px; }
      #app.live h1 { font-size: 20px; font-weight: 650; margin: 0 0 4px; }
      .lede { color: #939bab; margin: 0 0 16px; font-size: 14px; line-height: 1.45; }
      .toolbar, .presets, .views { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
      .host-bar { display: flex; gap: 8px; align-items: center; flex-shrink: 0; margin-left: auto; }
      .host-menu { position: relative; }
      .host-trigger { display: flex; align-items: center; gap: 8px; min-width: 14rem; white-space: nowrap; }
      .host-trigger .chev { margin-left: auto; color: #939bab; font-size: 11px; }
      .host-list {
        position: absolute; top: calc(100% + 6px); right: 0; z-index: 4;
        min-width: 16rem; max-height: 22rem; overflow: auto;
        background: #161a22; border: 1px solid #2a3142; border-radius: 8px;
        padding: 6px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      }
      .host-option {
        display: flex; width: 100%; align-items: center; gap: 8px;
        text-align: left; background: transparent; border-color: transparent;
      }
      .host-option.selected { background: #243044; border-color: transparent; }
      .host-list .group-label { margin: 8px 8px 2px; }
      .host-list .group-label:first-child { margin-top: 2px; }
      button.selected { background: #243044; border-color: #6ea8fe; }
      select, button {
        background: #1a1e28;
        color: #e8eaef;
        border: 1px solid #2a3142;
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
        font-size: 13px;
      }
      button { cursor: pointer; }
      button:hover { border-color: #42597d; }
      button.primary { background: #17352c; border-color: #3f6e5e; }
      button.danger { color: #f09196; }
      button:disabled { opacity: 0.5; cursor: wait; }
      .scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
      .scenes.single { grid-template-columns: 1fr; }
      .scene-wrap.hidden { display: none; }
      [hidden] { display: none !important; }
      @media (max-width: 1100px) { .scenes { grid-template-columns: 1fr; } }
      .scene-wrap svg { width: 100%; height: auto; display: block; }
      .pill {
        font-size: 11px; border-radius: 999px; padding: 2px 8px;
        border: 1px solid #2a3142; color: #939bab;
      }
      .pill.up { color: #8fd4ae; border-color: #3f6e5e; }
      .pill.down { color: #f09196; border-color: #8a4b55; }
      .pill.mixed { color: #f0b429; border-color: #8a6a2b; }
      .group-label { margin: 14px 0 0; font-size: 12px; color: #6b7384; letter-spacing: 0.04em; }
      .status { min-height: 1.2em; color: #f09196; font-size: 13px; margin: 0 0 12px; }
      .status.ok { color: #8fd4ae; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="./scene.js"></script>
    <script>
      (function () {
        const viz = window.FleetViz;
        const params = new URLSearchParams(location.search);
        const scene = params.get("scene");
        const tRaw = params.get("t");
        const app = document.getElementById("app");

        if ((scene === "per-machine" || scene === "per-group") && tRaw != null) {
          document.body.classList.add("capture");
          app.remove();
          const svg = viz.createSvg();
          document.body.appendChild(svg);
          const t = Number(tRaw);
          viz.render(svg, scene, viz.scriptedState(scene, Number.isFinite(t) ? t : 0));
          return;
        }

        if (params.has("scripted")) {
          startScripted();
          return;
        }

        fetch("/api/state")
          .then((res) => {
            if (!res.ok) throw new Error("not live");
            return res.json();
          })
          .then((state) => startLive(state))
          .catch(() => startScripted());

        function startScripted() {
          app.className = "scripted";
          const views = ["per-machine", "per-group"].map((name) => {
            const svg = viz.createSvg();
            app.appendChild(svg);
            return { name, svg };
          });
          const started = performance.now();
          function frame(now) {
            const t = ((now - started) / 1000) % viz.DURATION;
            for (const view of views) {
              viz.render(view.svg, view.name, viz.scriptedState(view.name, t));
            }
            requestAnimationFrame(frame);
          }
          requestAnimationFrame(frame);
        }

        function startLive(initial) {
          app.className = "live";
          let snapshot = initial;
          let error = "";
          let notice = "";
          let busy = false;
          const svgs = {};

          app.innerHTML = "";
          const h1 = document.createElement("h1");
          h1.textContent = "Fleet fan-out";
          const lede = document.createElement("p");
          lede.className = "lede";
          lede.textContent =
            "Send a webhook and watch it move. Session edges light from each machine's log. The request record is what Hookdeck stored.";
          const scenarioLine = document.createElement("p");
          scenarioLine.className = "lede";
          const status = document.createElement("p");
          status.className = "status";
          const views = document.createElement("div");
          views.className = "views";
          const presets = document.createElement("div");
          presets.className = "presets";
          const toolbar = document.createElement("div");
          toolbar.className = "toolbar";
          const scenes = document.createElement("div");
          scenes.className = "scenes";
          const hostBar = document.createElement("div");
          hostBar.className = "host-bar";
          app.append(h1, lede, scenarioLine, views, status, presets, toolbar, scenes);

          let mode = "per-machine";
          const viewChoice = [
            { id: "per-machine", label: "Connection per machine" },
            { id: "per-group", label: "Connection per group" },
            { id: "comparison", label: "Comparison" },
          ];

          const repo = document.createElement("select");
          const eventType = document.createElement("select");
          for (const name of ["push", "pull_request", "workflow_run"]) {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            eventType.appendChild(option);
          }

          function button(label, className, onClick) {
            const node = document.createElement("button");
            node.type = "button";
            node.textContent = label;
            if (className) node.className = className;
            node.addEventListener("click", onClick);
            return node;
          }

          const clearButton = button("Clear events", "", () => clearEvents());
          const machinesUpButton = button("All machines up", "", () => machinesUp());
          presets.append(
            button("Setup", "", () => project("/api/setup")),
            button("Teardown", "danger", () => {
              if (!confirm("Delete every connection in this Hookdeck project?")) return;
              project("/api/teardown");
            }),
            clearButton,
            machinesUpButton,
            hostBar,
          );

          const sendButton = button("Send", "primary", () => send(mode === "comparison" ? "both" : mode));
          toolbar.append(repo, eventType, sendButton);

          let selectedHost = "";
          let menuOpen = false;
          const hostMenu = document.createElement("div");
          hostMenu.className = "host-menu";
          const hostTrigger = button("", "", () => {
            menuOpen = !menuOpen;
            paintHostMenu();
          });
          hostTrigger.classList.add("host-trigger");
          const hostChevron = document.createElement("span");
          hostChevron.className = "chev";
          hostChevron.textContent = "▾";
          const hostList = document.createElement("div");
          hostList.className = "host-list";
          hostList.hidden = true;
          hostMenu.append(hostTrigger, hostList);
          const hostUpButton = button("Up", "", () => hostAction("up"));
          const hostDownButton = button("Down", "", () => hostAction("down"));
          const hostCrashButton = button("Crash", "danger", () => hostAction("crash"));
          hostBar.append(hostMenu, hostUpButton, hostDownButton, hostCrashButton);
          document.addEventListener("click", (event) => {
            if (!menuOpen || hostMenu.contains(event.target)) return;
            menuOpen = false;
            hostList.hidden = true;
            hostTrigger.setAttribute("aria-expanded", "false");
          });

          for (const choice of viewChoice) {
            views.append(button(choice.label, choice.id === mode ? "selected" : "", () => setMode(choice.id)));
          }

          for (const name of ["per-machine", "per-group"]) {
            const wrap = document.createElement("div");
            wrap.className = "scene-wrap";
            const svg = viz.createSvg();
            svgs[name] = svg;
            wrap.append(svg);
            scenes.appendChild(wrap);
          }

          let repoKey = "";
          let controlKey = "";

          function setMode(next) {
            mode = next;
            for (const node of views.querySelectorAll("button")) {
              node.classList.toggle("selected", node.textContent === labelFor(next));
            }
            scenes.classList.toggle("single", next !== "comparison");
            for (const name of ["per-machine", "per-group"]) {
              const wrap = svgs[name]?.parentElement;
              if (wrap) wrap.classList.toggle("hidden", next !== "comparison" && next !== name);
            }
            paintHostMenu();
          }

          function labelFor(id) {
            return viewChoice.find((choice) => choice.id === id)?.label || "";
          }

          function visibleApproaches() {
            return mode === "comparison" ? ["per-machine", "per-group"] : [mode];
          }

          function hostNames() {
            const names = [];
            for (const group of snapshot.groups || []) {
              for (const name of group.machines || []) {
                if (!names.includes(name)) names.push(name);
              }
            }
            return names.length ? names : viz.MACHINES.map((spec) => spec.name);
          }

          function paint() {
            scenarioLine.textContent = snapshot.scenario ? "Scenario " + snapshot.scenario : "";
            status.textContent = error || snapshot.error || notice;
            status.classList.toggle("ok", !error && !snapshot.error && !!notice);
            const repos = [];
            for (const group of snapshot.groups || []) {
              for (const item of group.repos || []) {
                if (!repos.includes(item)) repos.push(item);
              }
            }
            const nextRepoKey = repos.join("|");
            if (nextRepoKey !== repoKey) {
              repoKey = nextRepoKey;
              fillRepos();
            }
            const nextControl = JSON.stringify({
              approaches: snapshot.approaches || {},
              connections: snapshot.connections || {},
              mode,
            });
            if (nextControl !== controlKey) {
              controlKey = nextControl;
              paintHostMenu();
            }
            const showFleet = visibleApproaches().some((name) => routesReady(name));
            clearButton.hidden = !showFleet;
            machinesUpButton.hidden = !showFleet;
            toolbar.hidden = !showFleet;
            hostBar.hidden = !showFleet;
            for (const name of ["per-machine", "per-group"]) {
              viz.render(svgs[name], name, viewState(name, snapshot));
            }
            for (const node of app.querySelectorAll("button, select")) node.disabled = busy;
            if (!busy && !selectedHost) {
              hostUpButton.disabled = true;
              hostDownButton.disabled = true;
              hostCrashButton.disabled = true;
            }
          }

          function fillRepos() {
            const selected = repo.value;
            const repos = [];
            for (const group of snapshot.groups || []) {
              for (const item of group.repos || []) {
                if (!repos.includes(item)) repos.push(item);
              }
            }
            if (!repos.length) repos.push("demo-org/service-api");
            repo.replaceChildren();
            for (const item of repos) {
              const option = document.createElement("option");
              option.value = item;
              option.textContent = item;
              repo.appendChild(option);
            }
            if (repos.includes(selected)) repo.value = selected;
          }

          function routesReady(name) {
            const counts = snapshot.connections;
            if (!counts || typeof counts[name] !== "number") return true;
            return counts[name] > 0;
          }

          function hostsFor(approach) {
            return (snapshot.approaches && snapshot.approaches[approach]) || [];
          }

          function hostRows() {
            const rows = [];
            for (const group of snapshot.groups || []) {
              for (const name of group.machines || []) {
                rows.push({ group: group.name, name, state: hostState(name) });
              }
            }
            return rows;
          }

          function hostState(name) {
            const states = visibleApproaches().map((approach) => {
              const row = hostsFor(approach).find((machine) => machine.name === name);
              return !!(row && row.up);
            });
            if (!states.length || states.every((up) => !up)) return "down";
            if (states.every(Boolean)) return "up";
            return "mixed";
          }

          function statusPill(state) {
            const pill = document.createElement("span");
            pill.className = "pill " + state;
            pill.textContent = state;
            return pill;
          }

          function paintHostMenu() {
            const rows = hostRows();
            if (!rows.some((row) => row.name === selectedHost)) {
              selectedHost = rows[0] ? rows[0].name : "";
            }
            const selected = rows.find((row) => row.name === selectedHost);
            hostTrigger.replaceChildren();
            if (selected) hostTrigger.appendChild(statusPill(selected.state));
            hostTrigger.append(document.createTextNode(selected ? selected.name : "Host"), hostChevron);
            hostTrigger.setAttribute("aria-expanded", menuOpen ? "true" : "false");
            hostTrigger.setAttribute("aria-haspopup", "listbox");
            hostList.hidden = !menuOpen;
            hostList.replaceChildren();
            let lastGroup = "";
            for (const row of rows) {
              if (row.group !== lastGroup) {
                lastGroup = row.group;
                const label = document.createElement("div");
                label.className = "group-label";
                label.textContent = row.group;
                hostList.appendChild(label);
              }
              const option = button(row.name, "host-option" + (row.name === selectedHost ? " selected" : ""), () => {
                selectedHost = row.name;
                menuOpen = false;
                paintHostMenu();
              });
              option.prepend(statusPill(row.state));
              hostList.appendChild(option);
            }
            const ready = !!selectedHost;
            hostUpButton.disabled = !ready;
            hostDownButton.disabled = !ready;
            hostCrashButton.disabled = !ready;
          }

          async function hostAction(action) {
            if (!selectedHost) return;
            for (const approach of visibleApproaches()) {
              await fleet(approach, action, [selectedHost]);
            }
          }

          function viewState(name, data) {
            const groups = (data.groups || []).map((group) => ({
              name: group.name,
              hosts: group.machines || [],
            }));
            const rows = (data.approaches && data.approaches[name]) || [];
            const connected = routesReady(name);
            const machines = groups.flatMap((group) =>
              group.hosts.map((host) => {
                const row = rows.find((item) => item.name === host);
                const up = row ? row.up : false;
                return { name: host, up, presence: up ? 1 : 0, group: group.name };
              }),
            );
            if (!connected) {
              return { groups, machines, events: [], callout: null, calloutTone: null, legend: [], connections: false };
            }
            const deliveries = (data.deliveries || []).filter((d) => d.approach === name).slice(-4);
            const now = Date.now();
            const events = deliveries.map((delivery) => ({
              id: delivery.delivery,
              color: delivery.color,
              label: delivery.label,
              lanes: lanesFor(delivery, now),
            }));
            const latest = deliveries[deliveries.length - 1];
            return {
              groups,
              machines,
              events,
              callout: latest ? latest.callout : null,
              calloutTone: latest ? latest.calloutTone : null,
              legend: deliveries.map((d) => ({ color: d.color, label: d.label })),
            };
          }

          function lanesFor(delivery, now) {
            const age = Math.max(0, (now - Date.parse(delivery.sentAt)) / 1000);
            const travel = 1.6;
            const raw = Math.min(1, age / travel);
            const lanes = [];
            for (const machine of hostNames()) {
              if (!(delivery.targets || []).includes(machine)) continue;
              const local = (delivery.local || []).includes(machine);
              const recorded = (delivery.hookdeckLanes || []).find((lane) => lane.machine === machine);
              if (local || (recorded && recorded.outcome === "delivered")) {
                const progress = raw >= 1 ? 1 : smoothTo(raw);
                if (progress < 1) lanes.push({ machine, progress, outcome: "inflight" });
                else lanes.push({ machine, progress: 1, outcome: "delivered" });
                continue;
              }
              if (recorded && recorded.outcome === "disconnected") {
                lanes.push({
                  machine,
                  progress: 0.58,
                  outcome: "disconnected",
                  cause: recorded.cause,
                });
                continue;
              }
              const wasUp = (delivery.upAtSend || []).includes(machine);
              const settled = delivery.calloutTone === "ok" || delivery.calloutTone === "bad";
              if (!wasUp || (settled && raw >= 1)) continue;
              const held = Math.min(raw, 0.92);
              lanes.push({
                machine,
                progress: smoothTo(held / 0.92) * 0.92,
                outcome: "inflight",
              });
            }
            return lanes;
          }

          function smoothTo(u) {
            const x = Math.max(0, Math.min(1, u));
            return x * x * (3 - 2 * x);
          }

          async function project(path) {
            busy = true;
            error = "";
            notice = "";
            paint();
            try {
              const res = await fetch(path, { method: "POST" });
              const data = await res.json();
              if (!res.ok) throw new Error(data.error || res.statusText);
              snapshot = data;
              notice = typeof data.notice === "string" ? data.notice : "";
            } catch (err) {
              error = err instanceof Error ? err.message : String(err);
            } finally {
              busy = false;
              paint();
            }
          }

          async function clearEvents() {
            busy = true;
            error = "";
            notice = "";
            paint();
            try {
              const res = await fetch("/api/clear-events", { method: "POST" });
              const data = await res.json();
              if (!res.ok) throw new Error(data.error || res.statusText);
              snapshot = data;
              notice = typeof data.notice === "string" ? data.notice : "";
            } catch (err) {
              error = err instanceof Error ? err.message : String(err);
            } finally {
              busy = false;
              paint();
            }
          }

          async function fleet(approach, action, machines) {
            await act({ approach, action, machines });
          }

          async function machinesUp() {
            for (const approach of visibleApproaches()) {
              await act({ approach, action: "up", machines: [] });
            }
          }

          async function send(approach) {
            await actSend({ approach, repo: repo.value, event: eventType.value });
          }

          async function act(body) {
            busy = true;
            error = "";
            notice = "";
            paint();
            try {
              const res = await fetch("/api/fleet", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
              });
              const data = await res.json();
              if (!res.ok) throw new Error(data.error || res.statusText);
              snapshot = data;
            } catch (err) {
              error = err instanceof Error ? err.message : String(err);
            } finally {
              busy = false;
              paint();
            }
          }

          async function actSend(body) {
            busy = true;
            error = "";
            notice = "";
            paint();
            try {
              const res = await fetch("/api/send", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
              });
              const data = await res.json();
              if (!res.ok) throw new Error(data.error || res.statusText);
              snapshot = data;
            } catch (err) {
              error = err instanceof Error ? err.message : String(err);
            } finally {
              busy = false;
              paint();
            }
          }

          setMode(mode);
          paint();
          requestAnimationFrame(function tick() {
            for (const name of ["per-machine", "per-group"]) {
              viz.render(svgs[name], name, viewState(name, snapshot));
            }
            requestAnimationFrame(tick);
          });
          setInterval(async () => {
            if (busy) return;
            try {
              const res = await fetch("/api/state");
              if (!res.ok) return;
              snapshot = await res.json();
              error = "";
              paint();
            } catch {
              /* keep the last good snapshot while a poll fails */
            }
          }, 1000);
        }
      })();
    </script>
  </body>
</html>
