# The fleet, and the Hookdeck connections that deliver to it.
#
# Groups and hosts are the machines on the private network. They are not
# Hookdeck resources. A host must receive every event for its group's
# repositories. Hosts in a group are peers: the same event goes to all of them.
#
# Sources, destinations, and connections are the Event Gateway. A source
# receives the webhook. A connection routes that source to one CLI destination
# and keeps the events that match its filter. A host attaches by running
# `hookdeck listen` on a connection. `npm run setup` upserts the connections
# written below.
#
# Two sources exist so both connection sets can run at the same time. In
# production there is one source and one of these sets.

prefix: fleet-demo

groups:
  - name: group-a
    description: Three peer hosts. Every one must receive every event for these repositories.
    repos:
      - demo-org/service-api
      - demo-org/service-worker
    hosts:
      - group-a-host-01
      - group-a-host-02
      - group-a-host-03

  - name: group-b
    description: One host. Only its own repository's events.
    repos:
      - demo-org/release-tooling
    hosts:
      - group-b-host-01

sources:
  - name: fleet-demo-per-machine
    type: GITHUB
  - name: fleet-demo-per-group
    type: GITHUB

connections:
  # One connection per host. The connection is that host, so a miss is recorded
  # against it. One host listens.
  #
  # destination.path is --destination-cli-path: the path on that host that
  # receives the delivery. Each connection sets its own.

  - name: fleet-demo-group-a-host-01
    source: fleet-demo-per-machine
    destination: { name: fleet-demo-group-a-host-01, type: CLI, path: /webhooks/scm }
    hosts: [{ host: group-a-host-01, port: 4101 }]
    filter:
      repository:
        full_name:
          $in: [demo-org/service-api, demo-org/service-worker]

  - name: fleet-demo-group-a-host-02
    source: fleet-demo-per-machine
    destination: { name: fleet-demo-group-a-host-02, type: CLI, path: /webhooks/scm }
    hosts: [{ host: group-a-host-02, port: 4102 }]
    filter:
      repository:
        full_name:
          $in: [demo-org/service-api, demo-org/service-worker]

  - name: fleet-demo-group-a-host-03
    source: fleet-demo-per-machine
    destination: { name: fleet-demo-group-a-host-03, type: CLI, path: /webhooks/scm }
    hosts: [{ host: group-a-host-03, port: 4103 }]
    filter:
      repository:
        full_name:
          $in: [demo-org/service-api, demo-org/service-worker]

  - name: fleet-demo-group-b-host-01
    source: fleet-demo-per-machine
    destination: { name: fleet-demo-group-b-host-01, type: CLI, path: /webhooks/scm }
    hosts: [{ host: group-b-host-01, port: 4104 }]
    filter:
      repository:
        full_name:
          $in: [demo-org/release-tooling]

  # One connection per group. Every host in the group is a CLI session on that
  # same connection. Hookdeck sees the group, not the hosts.

  - name: fleet-demo-group-a
    source: fleet-demo-per-group
    destination: { name: fleet-demo-group-a, type: CLI, path: /webhooks/scm }
    hosts:
      - { host: group-a-host-01, port: 4201 }
      - { host: group-a-host-02, port: 4202 }
      - { host: group-a-host-03, port: 4203 }
    filter:
      repository:
        full_name:
          $in: [demo-org/service-api, demo-org/service-worker]

  - name: fleet-demo-group-b
    source: fleet-demo-per-group
    destination: { name: fleet-demo-group-b, type: CLI, path: /webhooks/scm }
    hosts: [{ host: group-b-host-01, port: 4204 }]
    filter:
      repository:
        full_name:
          $in: [demo-org/release-tooling]
