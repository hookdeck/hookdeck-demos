# The stand-in MCP server, deployed so a deployed agent can subscribe to it.
# Secrets (fly secrets set -c fly.sender.toml): SENDER_TOKEN.
app = 'mcp-events-receive-sender'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[processes]
  app = 'node --import tsx src/sender/index.ts'

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: subscriptions are held in memory, so a stopped machine forgets them.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
